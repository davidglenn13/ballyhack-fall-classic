name: Inspect Live Ballyhack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live production assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ballyhack-fall-classic-eno.pages.dev"
          HTML="$(curl -fsSL -H "Cache-Control: no-cache" "$BASE/?t=$(date +%s)")"
          echo "$HTML" | grep -o 'safeguards-beta.js?v=beta[0-9]*' | tail -1 || true
          SCRIPT_URL="$(echo "$HTML" | grep -o 'safeguards-beta.js?v=beta[0-9]*' | tail -1)"
          SCRIPT="$(curl -fsSL -H "Cache-Control: no-cache" "$BASE/$SCRIPT_URL&t=$(date +%s)" || curl -fsSL -H "Cache-Control: no-cache" "$BASE/$SCRIPT_URL")"
          echo "LIVE_SCRIPT=$SCRIPT_URL"
          echo "$SCRIPT" | grep -F "input.readOnly=isLocked&&!viewOnly" || true
          echo "$SCRIPT" | grep -F "input.disabled=viewOnly" || true
          echo "$SCRIPT" | grep -F "const disabled=locked(round,group)" || true
