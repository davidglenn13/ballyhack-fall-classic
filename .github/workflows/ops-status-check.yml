name: Production status check

on:
  push:
    branches:
      - ops-status-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read production setup status
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://ballyhack-fall-classic-eno.pages.dev/api/secure-state"
          req = urllib.request.Request(url, headers={"User-Agent":"ballyhack-status-check"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          out = {
              "setup": data.get("setup", {}),
              "access": data.get("access", {}),
              "safeguards": data.get("safeguards", {})
          }
          print("STATUS_JSON=" + json.dumps(out, sort_keys=True))
          PY

# recheck 2026-09-29T19:42Z
