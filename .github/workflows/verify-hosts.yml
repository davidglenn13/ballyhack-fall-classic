name: Verify Ballyhack Hosts

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify beta handoff and production build
        shell: bash
        run: |
          set -euo pipefail
          BETA="https://ballyhack-fall-classic.pages.dev"
          PROD="https://ballyhack-fall-classic-eno.pages.dev"
          BETA_HTML="$(curl -fsSL -H "Cache-Control: no-cache" "$BETA/?t=$RANDOM")"
          PROD_HTML="$(curl -fsSL -H "Cache-Control: no-cache" "$PROD/?t=$RANDOM")"
          echo "$BETA_HTML" | grep -F "ballyhack-fall-classic-eno.pages.dev/?from=beta"
          echo "$PROD_HTML" | grep -F "safeguards-beta.js?v=beta94"
          echo "HOSTS_VERIFIED"
