name: Diagnose Ballyhack Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production DNS and HTTP
        shell: bash
        run: |
          set +e
          HOST="ballyhack-fall-classic-eno.pages.dev"
          URL="https://$HOST/"
          echo "=== DNS via getent ==="
          getent ahosts "$HOST"
          echo "GETENT_EXIT=$?"
          echo "=== DNS via Python ==="
          python3 - <<'PY'
          import socket
          host="ballyhack-fall-classic-eno.pages.dev"
          try:
              print(socket.getaddrinfo(host,443))
          except Exception as e:
              print("DNS_ERROR",repr(e))
          PY
          echo "=== HTTPS headers ==="
          curl -vI --connect-timeout 10 --max-time 20 "$URL"
          echo "CURL_EXIT=$?"
          echo "=== Homepage GET ==="
          HTML="$(curl -fsSL --connect-timeout 10 --max-time 20 "$URL")"
          echo "$HTML" | grep -o '<title>[^<]*</title>' | head -1
          echo "$HTML" | grep -o 'app.js?v=[^"]*' | tail -1
          echo "$HTML" | grep -o 'gross-scores-page.js?v=[^"]*' | tail -1
          echo "$HTML" | grep -o 'safeguards-beta.js?v=[^"]*' | tail -1
          echo "HTML_BYTES=$(printf %s "$HTML" | wc -c)"
          echo "=== API reachability ==="
          curl -sS -o /tmp/api.out -w 'API_HTTP=%{http_code}\n' --connect-timeout 10 --max-time 20 "$URL/api/secure-state"
          head -c 300 /tmp/api.out || true
          echo
