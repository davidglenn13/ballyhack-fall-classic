name: Verify Official Round 1 Result

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live tournament state
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ballyhack-fall-classic-eno.pages.dev/api/secure-state?t=$RANDOM"
          BODY="$(curl -fsSL -H "Cache-Control: no-cache" "$URL")"
          echo "$BODY" | jq '{scores:([.scores["1"] // {} | to_entries[] | .value | to_entries[]] | length),sideGame:.sideGames["1"],wager:.fortyBallBets["1"],official:.fortyBallOfficialResults["1"]}'
          test "$(echo "$BODY" | jq -r '.sideGames["1"]')" = "40 Ball"
          test "$(echo "$BODY" | jq -r '.fortyBallBets["1"]')" = "80"
          test "$(echo "$BODY" | jq -r '.fortyBallOfficialResults["1"].winnerGroup')" = "1"
          test "$(echo "$BODY" | jq '[.scores["1"] // {} | to_entries[] | .value | to_entries[]] | length')" = "144"
          echo "OFFICIAL_RESULT_VERIFIED"
