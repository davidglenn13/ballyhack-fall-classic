name: Beta Test Suite
# Runs the repository's node:test suite on every beta push.

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
