name: One-time beta reset trigger
on:
  push:
    branches: [beta]
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed beta reset endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://a3fcc4cc.ballyhack-fall-classic.pages.dev/api/secure-state \
            -o /tmp/reset.json
          python - <<'PY'
          import json
          with open('/tmp/reset.json') as f:
              data=json.load(f)
          assert data.get('scores',{}) == {}, 'scores not empty after reset'
          assert data.get('sideGames',{}) in ({'1':'None','2':'None','3':'None','4':'None'},{1:'None',2:'None',3:'None',4:'None'}), data.get('sideGames')
          assert data.get('safeguards',{}).get('authenticated') is False
          print('Beta reset endpoint returned a clean unauthenticated state.')
          PY
